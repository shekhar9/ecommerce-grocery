<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/lumen/bootstrap.min.css">

</head>
<body>
    <h2>Product List</h2>
<table class="table table-hover">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col">Image</th>
            <th scope="col">Price</th>
            <th scope="col">Stock</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.description|truncatewords:10 }}</td>
            <td><img src="{{ product.main.images.url }}" alt="{{ brands.name }}"></td>
            <td>{{ product.price }}</td>
            <td>{{ product.stock }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No products available.</td></tr>
        {% endfor %}
    </tbody>
</table>
    <a href="{% url 'admin_dashboard' %}">Back to Admin Dashboard</a>
    <a href="{% url 'add_product' %}">Add Product</a>
</body>
</html>
