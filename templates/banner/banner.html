<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5; /* Highlight row on hover */
        }
    </style>
</head>
<body>
    <h1>Banner List</h1>
    <form method="GET" action="{% url 'banners_list' %}">
        <input type="text" name="search" placeholder="Search by name" value="{{ request.GET.search }}">
        <button type="submit">Filter</button>
    </form>
    <a href="{% url 'add_banner' %}">Add New Banner</a>
    
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for banner in banners1 %}
                <tr>
                    <td>{{ banner.title }}</td>
                    <td><img src="{{ banner.image.url }}" alt="{{ banner.title }}" style="max-width: 100px; height: auto;"></td>
                    <td>
                        <a href="{% url 'edit_banner' banner.id %}">Edit</a>
                        <a href="{% url 'delete_banner' banner.id %}">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No banners available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'admin_dashboard' %}">Back to Admin Dashboard</a>
</body>
</html>
