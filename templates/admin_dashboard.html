<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0px;
        }
        a {
            color: #007bff; /* Link color */
            text-decoration: none; /* Remove underline */
            padding: 5px 10px; /* Add padding */
            border-radius: 4px; /* Rounded corners */
            transition: background-color 0.3s, color 0.3s; /* Smooth transition for hover effects */
        }

        a:hover {
            background-color: #f0f0f0; /* Light background on hover */
            color: #0056b3; /* Darker color on hover */
        }

        /* Basic styles for the templates */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex; /* Use flexbox for layout */
        }

        .sidebar {
            width: 220px;
            background-color: #007bff;
            color: white;
            padding: 15px;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar h2 {
            color: white;
            margin-top: 0;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }

        .sidebar a:hover {
            background-color: #0056b3;
        }

        .dropdown {
            position: relative;
        }

        .sidebar .dropdown-menu {
            display: none; /* Prevent Bootstrap from overriding */
            background: #0069d9;
            padding-left: 10px;
            border-radius: 5px;
        }

        .sidebar .dropdown-menu.show {
            display: block;
        }

        .content {
            flex: 1;
            padding: 20px;
            background: white;
            margin: 0; /* Ensure no margin is causing extra space */
        }

        h1 {
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Menu</h2>
        <a href="{% url 'admin_dashboard' %}" onclick="loadPage(); return false;">Home</a>

        <div class="dropdown">
            <a href="#" onclick="toggleDropdown('productDropdown'); return false;">Products</a>
            <ul class="dropdown-menu" id="productDropdown">
                <li><a href="#" onclick="loadPage(event, '{% url 'inventory_view' %}'); return false;">Inventory</a></li>
                <li><a href="#" onclick="loadPage(event, '{% url 'categories' %}'); return false;">Categories</a></li>
                <li><a href="#" onclick="loadPage(event, '{% url 'brand_view' %}'); return false;">Brands</a></li>
            </ul>
        </div>

        <a href="{% url 'admin_order_list' %}" onclick="loadPage(event, '{% url 'admin_order_list' %}'); return false;">Orders</a>
        <a href="{% url 'banners_list' %}" onclick="loadPage(event, '{% url 'banners_list' %}'); return false;">Banners</a>
        <a href="{% url 'customer_list' %}" onclick="loadPage(event, '{% url 'customer_list' %}'); return false;">Users</a>
        <a href="{% url 'discount_list' %}" onclick="loadPage(event, '{% url 'discount_list' %}'); return false;">Discounts</a>

        <a href="{% url 'sellers_list1' %}" onclick="loadPage(event, '{% url 'sellers_list1' %}'); return false;">Sellers</a>
        <a href="#">Settings</a>
        <a href="{% url 'admin_logout' %}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content" id="content">
        <h1>Welcome to the Admin Dashboard</h1>
        <p>Select an option from the sidebar to get started.</p>
    </div>

    <!-- JavaScript for AJAX-based Content Loading -->
    <script>
        function loadPage(event, url) {
            if (event) event.preventDefault();
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('content').innerHTML = html;
                })
                .catch(error => console.error('Error loading page:', error));
        }

        function toggleDropdown(id) {
            var dropdown = document.getElementById(id);
            if (dropdown.style.display === "none" || dropdown.style.display === "") {
                dropdown.style.display = "block";
            } else {
                dropdown.style.display = "none";
            }
        }
    </script>
</body>
</html>
