<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Discount List</h2>
    <a href="{% url 'discount' %}">Add New Discount</a>


    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Discount Code</th>
                <th>Discount Amount</th>
                <th>Expiration Date</th>
            </tr>
        </thead>
        <tbody>
            {% for discount in discounts %}
            <tr>
                <td>{{ discount.id }}</td>
                <td>{{ discount.code }}</td>
                <td>{{ discount.amount }}</td>
                <td>{{ discount.expiration_date }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No discounts available.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
