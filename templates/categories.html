<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .icon-large {
            font-size: 1.5em; /* Increase icon size */
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        img {
            max-width: 100px;
        }
        .add-category {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Categories</h1>
    <form method="GET" action="{% url 'categories' %}">
        <label for="category_head">Filter by Category Head:</label>
        <select name="category_head" id="category_head" onchange="this.form.submit()">
            <option value="">-- All Categories --</option>
            {% for choice in category_heads %}
                <option value="{{ choice.0 }}" {% if choice.0 == request.GET.category_head %}selected{% endif %}>{{ choice.1 }}</option>
            {% endfor %}
        </select>
    </form>

    <p>Manage your product categories here.</p>
    
    <div class="add-category">
        <a href="{% url 'add_category' %}">Add Category</a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Category Head</th>
                <th>Seller Percentage</th>
                <th>Media</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.title }}</td>
                <td>{{ category.category_head }}</td>
                <td>{{ category.seller_percentage }}</td>
                <td><img src="{{ category.media.url }}" alt="{{ category.title }}"></td>
                <td>
                    <a href="{% url 'delete_category' category.id %}" onclick="return confirm('Are you sure you want to delete this category?');">
                        <i class="fas fa-trash icon-large" aria-hidden="true"></i> 
                    </a>
                    <a href="{% url 'edit_category' category.id %}">
                        <i class="fas fa-edit icon-large" aria-hidden="true"></i> 
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
