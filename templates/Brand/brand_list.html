<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand List</title>
    
    <style>
        .icon-large {
            font-size: 1.5em; /* Increase icon size */
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        img {
            max-width: 100px; /* Set maximum width */
            max-height: 50px; /* Set maximum height */
            height: auto; /* Maintain aspect ratio */
        }

        .add-category {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Brand</h1>
    
    <div class="add-category">
        <a href="{% url 'add_brand' %}"> Add Brand</a>
    </div>

    <form method="GET" action="{% url 'brand_view' %}">
        <input type="text" name="search" placeholder="Search by name" value="{{ request.GET.search }}">
        <button type="submit">Filter</button>
    </form>
    
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Title</th>
                <th>Logo</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for brands in brands %}
            <tr>
                <td>{{ brands.name }}</td>
                <td><img src="{{ brands.logo.url }}" alt="{{ brands.name }}"></td>
                <td>
                    <a href="{% url 'delete_brand' brands.id %}">
                        <i class="fas fa-trash icon-large" aria-hidden="true">Delete</i> 
                    </a>
                    <a href="{% url 'edit_brand' brands.id %}">
                        <i class="fas fa-edit icon-large" aria-hidden="true">Edit</i> 
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <div class="pagination">
        {% if brands.has_previous %}
            <a href="?page=1">First</a>
            <a href="?page={{ brands.previous_page_number }}">Previous</a>
        {% endif %}

        <span>Page {{ brands.number }} of {{ brands.paginator.num_pages }}</span>

        {% if brands.has_next %}
            <a href="?page={{ brands.next_page_number }}">Next</a>
            <a href="?page={{ brands.paginator.num_pages }}">Last</a>
        {% endif %}
    </div>

</body>
</html>
